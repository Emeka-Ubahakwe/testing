# Pull request: build the image (no push) and run what-if.
# Merge to main: build and push the image to ghcr, run what-if, then deploy.

name: deploy

on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'infra/**', '.github/workflows/deploy.yml']
  push:
    branches: [main]
    paths: ['app/**', 'infra/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: Emeka-Sandbox
  IMAGE_NAME: ghcr.io/emeka-ubahakwe/obs-sandbox-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "image=$IMAGE_NAME:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tag.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  infra:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: what-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name obs-sandbox \
            --parameters infra/main.bicepparam

      - name: deploy
        if: github.event_name != 'pull_request'
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name obs-sandbox \
            --parameters infra/main.bicepparam \
            --query properties.outputs
